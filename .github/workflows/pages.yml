# Runs the Node tests and publishes the game to GitHub Pages on every push to main.
name: Tests und GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Tests ohne Browser
        run: |
          status=0
          for t in tests/*.cjs; do
            case "$t" in tests/browser*) continue;; esac
            echo "::group::$t"
            node "$t" || status=1
            echo "::endgroup::"
          done
          exit $status

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Spieldateien zusammenstellen
        run: |
          mkdir _site
          cp -r index.html help.html styles.css manifest.webmanifest sw.js LICENSE src _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
